# Configuration nginx du frontend CyberWatch AI (application React monopage).
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ROUTAGE CÔTÉ CLIENT : React Router gère /consultant/cves, /admin/sources, etc. Ces
    # chemins n'existent pas sur le disque ; sans ce repli, un rafraîchissement (F5) sur
    # une page interne renverrait un 404 nginx au lieu de l'application.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers générés par Vite portent une empreinte dans leur nom : ils peuvent être
    # mis en cache indéfiniment. index.html, lui, ne doit jamais l'être, sinon le navigateur
    # continuerait de charger l'ancienne version après un déploiement.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # En-têtes de sécurité de base (l'application est servie en interne).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
